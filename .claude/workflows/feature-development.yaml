# Feature Development Workflow
# 新功能开发工作流

name: Feature Development
description: 从需求分析到部署的完整功能开发流程

steps:
  - name: "1. 需求分析"
    agent: general-purpose
    actions:
      - 分析需求和约束条件
      - 识别相关文件和依赖
      - 评估技术可行性

  - name: "2. 设计方案"
    agent: Plan
    actions:
      - 设计实现方案
      - 列出关键文件
      - 识别架构权衡
    output: implementation-plan.md

  - name: "3. TDD 开发"
    agent: test-writer
    actions:
      - "RED: 编写失败测试"
      - "GREEN: 实现功能"
      - "REFACTOR: 重构优化"
    loop: true
    until:
      - 所有测试通过
      - 代码符合规范

  - name: "4. 代码审查"
    agent: code-reviewer
    actions:
      - 检查代码质量
      - 验证安全性
      - 评估可维护性
    output: review-report.md

  - name: "5. 集成测试"
    command: /test
    actions:
      - 运行完整测试套件
      - 验证 API 兼容性
      - 检查性能影响

  - name: "6. 文档更新"
    actions:
      - 更新 CLAUDE.md
      - 添加 API 文档
      - 更新 CHANGELOG

  - name: "7. 提交代码"
    command: /commit
    actions:
      - 暂存变更
      - 生成提交信息
      - 创建提交

  - name: "8. 创建 PR"
    actions:
      - 生成 PR 描述
      - 关联相关 Issue
      - 请求审查

exit_conditions:
  - 所有测试通过
  - 代码审查通过
  - 文档已更新
  - CI 检查通过

rollback_actions:
  - 回滚最后一次提交
  - 恢复到开发前状态
